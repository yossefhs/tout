# Déploiement du dossier site/ vers l'hébergement OVH par SFTP (chiffré, port 22, lftp) à chaque push sur la branche clientsici-prospection.
# Diagnostic du 2026-11-06 : port 22 ouvert, FTPS refusé par le serveur, port 990 fermé.
# À copier dans le dépôt du site sous .github/workflows/deploy.yml
# Secrets à créer dans le dépôt (Settings > Secrets and variables > Actions) :
#   FTP_SERVER   ex. ftp.cluster0xx.hosting.ovh.net  (ou le serveur SFTP OVH)
#   FTP_USERNAME identifiant FTP OVH
#   FTP_PASSWORD mot de passe FTP OVH
name: Déploiement OVH (site/)

on:
  push:
    branches: [clientsici-prospection]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : lister les fichiers sans rien envoyer"
        type: boolean
        default: false
      diag:
        description: "Diagnostic seulement : ports ouverts et test SFTP chiffré, sans déploiement"
        type: boolean
        default: false

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diag == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ports et protocoles disponibles sur le serveur (aucun secret affiché)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          echo "Résolution DNS : $(getent hosts "$FTP_SERVER" >/dev/null && echo OK || echo ECHEC)"
          for p in 21 22 990; do timeout 8 bash -c "cat < /dev/null > /dev/tcp/$FTP_SERVER/$p" 2>/dev/null && echo "port $p : ouvert" || echo "port $p : fermé ou filtré"; done
          echo "Bannière FTP (port 21) :"; timeout 8 bash -c "exec 3<>/dev/tcp/$FTP_SERVER/21; head -c 200 <&3" 2>/dev/null | head -2
          sudo apt-get install -y -q lftp >/dev/null 2>&1
          echo "Test SFTP chiffré (port 22) avec les identifiants :"
          lftp -e "set net:timeout 15; set net:max-retries 1; set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no -o ConnectTimeout=15'; ls; bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" >/tmp/sftp.log 2>&1 && echo "SFTP : connexion et identification OK" || { echo "SFTP : échec"; sed -e "s/$FTP_PASSWORD/***/g" /tmp/sftp.log | head -5; }
          echo "Test FTPS explicite (port 21) :"
          lftp -e "set net:timeout 15; set net:max-retries 1; set ftp:ssl-force true; set ftp:ssl-protect-data true; ls; bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" >/tmp/ftps.log 2>&1 && echo "FTPS : connexion et identification OK" || { echo "FTPS : échec"; sed -e "s/$FTP_PASSWORD/***/g" /tmp/ftps.log | head -5; }
  deploy:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diag == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # l'action FTP compare les états entre deux déploiements

      - name: Contrôles avant envoi
        run: |
          test -d site || { echo "dossier site/ absent"; exit 1; }
          # aucune maquette d'aperçu sans son .htaccess (noindex + pas de listage)
          for d in site/apercu/*/; do
            [ -d "$d" ] || continue
            [ -f "$d/.htaccess" ] || { echo "$d : .htaccess manquant"; exit 1; }
            grep -q "noindex" "$d/.htaccess" || { echo "$d : noindex absent du .htaccess"; exit 1; }
          done
          echo "Fichiers à déployer :"; find site -type f | sort | head -200

      - name: Envoi SFTP (chiffré, port 22) vers OVH avec lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && '--dry-run' || '' }}
          SERVER_DIR: ./www/
        run: |
          sudo apt-get install -y -q lftp >/dev/null 2>&1
          echo "Mode : ${DRY_RUN:-envoi réel} ; destination : $SERVER_DIR"
          # mirror -R : envoie site/ vers la racine web ; jamais de suppression distante (pas de --delete) ;
          # --only-newer : ne renvoie que les fichiers modifiés ; exclusions : captures, états, fichiers système.
          lftp -e "set net:timeout 30; set net:max-retries 2; set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no -o ConnectTimeout=20'; \
                   mirror -R --only-newer --no-perms --verbose=1 $DRY_RUN \
                     --exclude-glob .git* --exclude-glob '*.map' --exclude-glob .DS_Store --exclude-glob Thumbs.db --exclude-glob '*.tmp' \
                     --exclude-glob 'README*.md' --exclude captures/ --exclude-glob '.maquette-*' \
                     ./site/ $SERVER_DIR; bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "sftp://$FTP_SERVER" 2>&1 | sed -e "s/$FTP_PASSWORD/***/g"
          test ${PIPESTATUS[0]} -eq 0
